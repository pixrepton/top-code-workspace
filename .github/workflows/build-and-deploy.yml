name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-gmail-agent:
    name: Build gmail-agent image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gmail-agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gmail-agent runtime
        uses: docker/build-push-action@v6
        with:
          context: gmail-agent
          file: gmail-agent/docker/gmail-audit.Dockerfile
          tags: gmail-agent-runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-rag:
    name: Build RAG backend image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-chat-asystent/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build RAG backend
        uses: docker/build-push-action@v6
        with:
          context: rag-chat-asystent/backend
          file: rag-chat-asystent/backend/Dockerfile
          tags: rag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-and-test:
    name: Lint and basic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install flake8
      - name: Check Python syntax
        run: |
          python -m py_compile gmail-agent/tools/gmail_audit/*.py 2>/dev/null || true
          python -m py_compile rag-chat-asystent/backend/*.py 2>/dev/null || true
      - name: Check for FIXME/TODO markers
        run: |
          echo "FIXME/TODO count:"
          rg -c "FIXME|TODO|HACK" --type py gmail-agent/tools/gmail_audit rag-chat-asystent/backend 2>/dev/null || true

  architecture-drift:
    name: Architecture Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check artifact consistency
        run: |
          python scripts/architecture-drift-check.py || echo "Drift detected — review artifacts"
