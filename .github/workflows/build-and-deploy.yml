name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-gmail-agent:
    name: Build gmail-agent image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gmail-agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gmail-agent runtime
        uses: docker/build-push-action@v6
        with:
          context: gmail-agent
          file: gmail-agent/docker/gmail-audit.Dockerfile
          tags: gmail-agent-runtime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-rag:
    name: Build RAG backend image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-chat-asystent/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build RAG backend
        uses: docker/build-push-action@v6
        with:
          context: rag-chat-asystent/backend
          file: rag-chat-asystent/backend/Dockerfile
          tags: rag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-and-test:
    name: Lint and basic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install flake8
      - name: Check Python syntax
        run: |
          python -m py_compile gmail-agent/tools/gmail_audit/*.py 2>/dev/null || true
          python -m py_compile rag-chat-asystent/backend/*.py 2>/dev/null || true
      - name: Check for FIXME/TODO markers
        run: |
          echo "FIXME/TODO count:"
          rg -c "FIXME|TODO|HACK" --type py gmail-agent/tools/gmail_audit rag-chat-asystent/backend 2>/dev/null || true

  architecture-drift:
    name: Architecture Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check artifact consistency
        run: |
          python scripts/architecture-drift-check.py || echo "Drift detected — review artifacts"

  test-gmail-agent:
    name: Test gmail-agent unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAILBOX_MEMORY_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      MAILBOX_DB_URL: postgresql://test_user:test_password@localhost:5432/test_db
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: gmail-agent/tools/gmail_audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize database
        working-directory: gmail-agent/tools/gmail_audit
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector"
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f ../../../scripts/index_migration.sql 2>/dev/null || true
      - name: Run unit tests
        working-directory: gmail-agent/tools/gmail_audit
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_neo4j_pilot.py \
            --ignore=tests/test_daszek_local_133.py \
            --ignore=tests/test_daszek_system_diagrams_proof.py \
            -k "not neo4j and not daszek_local" \
            -W ignore::DeprecationWarning
      - name: Run integration tests
        working-directory: gmail-agent/tools/gmail_audit
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Run golden dataset validation
        working-directory: gmail-agent/tools/gmail_audit
        run: |
          python -m pytest tests/test_golden_dataset.py -v --tb=short
