name: kalk-top-local

# Local Docker runtime for kalk-top + fast-kalk (PHP built-in server).
# Equivalent of: kalk-top\scripts\start-runtime-wp.ps1
#
# Start:
#   docker compose -f docker-compose.kalk-top-local.yml up -d
#
# Proof:
#   php fast-kalk/scripts/e2e-scenarios-smoke.php
#   or: curl http://localhost:8091/wp-json/

services:
  kalk-top:
    build:
      context: ./kalk-top
      dockerfile: docker/Dockerfile.local
    image: kalk-top-runtime:local
    container_name: kalk-top-runtime
    restart: unless-stopped
    ports:
      # Bind to all interfaces so host.docker.internal resolves correctly for Docker containers
      - "0.0.0.0:8091:8091"
    volumes:
      # Bind-mount repos as rw (entrypoint syncs plugin files on startup)
      - ./kalk-top:/kalk-top:rw
      - ./fast-kalk:/fast-kalk:ro
      - ./top-instal-generator:/top-instal-generator:ro
      # Local php -S does not rewrite /wp-json/* unless a front-controller maps it.
      # Canonical product clients use pretty permalinks; do not work around this in gmail-agent.
      # kalk-top/docker/entrypoint-local.sh still generates a weaker router if this overlay is absent.
      - ./scripts/kalk-top-local/_router.php:/opt/topinstal-runtime/wordpress/_router.php:ro
    # configure-runtime-wp.php reads KALKTOP_AGENT_KEY. Compose ${KALK_TOP_AGENT_KEY}
    # interpolates from the host/project .env, NOT from service env_file, and would
    # bind an empty consumer key. Alias inside the container after env_file is applied.
    entrypoint:
      - /bin/bash
      - -c
      - export KALKTOP_AGENT_KEY="$${KALKTOP_AGENT_KEY:-$${KALK_TOP_AGENT_KEY}}"; exec /entrypoint.sh
    environment:
      # Use host.docker.internal so downloadUrls are resolvable from other Docker containers
      KALK_TOP_RUNTIME_BASE_URL: http://host.docker.internal:8091
      NODE_B_REGISTRY_BASE_URL: http://host.docker.internal:8766
    env_file:
      - ./gmail-agent/.env.local-vps
